name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: TypeScript and formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: TypeScript check
        run: pnpm run typecheck

      - name: Linting check
        run: pnpm run lint

      - name: Formatting check
        run: pnpm run format:check

  dev:
    name: Development server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Request home page from pnpm dev
        run: |
          HOST=127.0.0.1 PORT=3000 pnpm dev > /tmp/ecap-dev.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          response_code=000
          for attempt in $(seq 1 90); do
            response_code=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 http://127.0.0.1:3000/ || true)
            if [ "$response_code" = 200 ]; then
              echo 'GET / returned HTTP 200'
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/ecap-dev.log
              echo "pnpm dev exited before GET / returned HTTP 200 (received $response_code)"
              exit 1
            fi
            sleep 1
          done

          cat /tmp/ecap-dev.log
          echo "Expected HTTP 200 from pnpm dev, received $response_code"
          exit 1

  build:
    name: Production build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Build production app
        run: pnpm build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: |
            dist/
            apps/web/.next/
          include-hidden-files: true
          if-no-files-found: error

  start:
    name: Production server
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: production-build

      - name: Request home page from pnpm start
        run: |
          HOST=127.0.0.1 PORT=3000 pnpm start > /tmp/ecap-start.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          response_code=000
          for attempt in $(seq 1 90); do
            response_code=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 http://127.0.0.1:3000/ || true)
            if [ "$response_code" = 200 ]; then
              echo 'GET / returned HTTP 200'
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/ecap-start.log
              echo "pnpm start exited before GET / returned HTTP 200 (received $response_code)"
              exit 1
            fi
            sleep 1
          done

          cat /tmp/ecap-start.log
          echo "Expected HTTP 200 from pnpm start, received $response_code"
          exit 1
